<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acceso privado | AUTO VERSE</title><link rel="stylesheet" href="assets/admin.css"></head><body><main id="login-screen" class="login-wrap"><a href="/" class="back">← AUTO VERSE</a><section class="login card"><div class="label">ÁREA PRIVADA</div><h1>Administrar inventario</h1><p>Acceso exclusivo para el equipo AUTO VERSE.</p><form id="login"><label>Usuario<input name="username" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><button>Iniciar sesión</button><p id="error" role="alert"></p></form></section></main><main id="dashboard" class="dashboard" hidden><div class="dash-head"><div><a class="back" href="/">AUTO VERSE</a><h1>Gestionar coches</h1></div><button id="logout">Cerrar sesión</button></div><p class="note">Panel privado. Los coches guardados aquí se publican en la web.</p><form id="car-form" class="card"><h2>Añadir coche</h2><div class="dash-grid"><label>Marca<input name="brand" required></label><label>Modelo<input name="model" required></label><label>Versión<input name="trim"></label><label>Precio (€)<input name="price_eur" type="number" min="1" required></label><label>Año<input name="year" type="number" min="1950" required></label><label>Kilómetros<input name="mileage_km" type="number" min="0" required></label><label>Combustible<select name="fuel"><option>Gasolina</option><option>Diésel</option><option>Híbrido</option><option>Eléctrico</option><option>GLP</option></select></label><label>Cambio<select name="transmission"><option>Manual</option><option>Automático</option></select></label><label>Tipo<input name="body_type" placeholder="SUV, compacto…" required></label><label class="wide">Descripción<textarea name="description" rows="3"></textarea></label><label class="wide">Foto (JPG, PNG o WebP, máx. 3 MB)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label></div><p id="note" role="status"></p><button>Añadir al stock</button></form><h2>Stock publicado</h2><div id="stock" class="stock"></div></main><script src="assets/admin-app.js"></script></body></html>
